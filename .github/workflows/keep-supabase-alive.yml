name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/posts_public?select=id&limit=1&apikey=${{ secrets.SUPABASE_ANON_KEY }}")
          echo "$RESP"
          echo "$RESP" | tail -n1 | grep -q "200" || exit 1
